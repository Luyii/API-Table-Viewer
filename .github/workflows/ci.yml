name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Tests (Node.js ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Keep the documented minimum alongside newer Node.js versions.
        node: [18, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      # Tests use Node.js built-ins only; no npm install or lockfile is needed.
      - name: Test impacted modules
        run: npm run test:changed -- --ci

  package:
    name: Extension ZIP
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Build extension ZIP
        run: python3 scripts/package.py
      - name: Verify ZIP contents and extracted extension resources
        run: python3 tests/package-archive.py
      - name: Upload verified extension ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: API-Table-Viewer-${{ github.sha }}
          path: dist/API-Table-Viewer-v*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    needs: package
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release: publish v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: API-Table-Viewer-${{ github.sha }}
          path: dist
      - name: Validate release metadata
        run: node scripts/release-metadata.cjs >> "$GITHUB_ENV"
      - name: Verify downloaded package and checksum
        run: |
          python3 tests/package-archive.py
          cd dist
          sha256sum "API-Table-Viewer-$RELEASE_TAG.zip" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Create tag and publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Refuse duplicates; distinguish absence from authentication/network errors.
          for endpoint in "releases/tags/$RELEASE_TAG" "git/ref/tags/$RELEASE_TAG"; do
            if gh api "repos/$GH_REPO/$endpoint" > /tmp/release-check.json 2> /tmp/release-check.err; then
              echo "Already exists: $endpoint; refusing to overwrite."
              exit 1
            elif ! grep -q 'HTTP 404' /tmp/release-check.err; then
              cat /tmp/release-check.err
              exit 1
            fi
          done
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          gh release create "$RELEASE_TAG" "dist/API-Table-Viewer-$RELEASE_TAG.zip" dist/SHA256SUMS.txt --target "$GITHUB_SHA" --title "$RELEASE_TITLE" --notes-file "$RELEASE_NOTES" --draft
          test "$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq .object.sha)" = "$GITHUB_SHA"
          gh release edit "$RELEASE_TAG" --draft=false --latest

